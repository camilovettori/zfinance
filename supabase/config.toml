project_id = "homecoin"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "homecoin"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.whatsapp-webhook]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.whatsapp-reminders]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.whatsapp-test]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.receipt-scan]
verify_jwt = false
import_map = "./functions/deno.json"
